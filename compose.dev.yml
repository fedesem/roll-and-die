services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${DEV_CONTAINER_NAME:-roll-and-die-dev}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      HOME: /tmp/app-home
      NPM_CONFIG_CACHE: /tmp/app-home/.npm
      PORT: ${SERVER_PORT:-4000}
    ports:
      - "${SERVER_PORT:-4000}:4000"
      - "${CLIENT_PORT:-5174}:5174"
    volumes:
      - .:/app
    labels:
      traefik.http.services.roll-and-die.loadbalancer.server.port: "5174"

  npm:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles:
      - tools
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${SERVER_PORT:-4000}
      HOME: /tmp/app-home
      NPM_CONFIG_CACHE: /tmp/app-home/.npm
    volumes:
      - .:/app
    networks:
      - default
